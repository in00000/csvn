{{ define "main" }}

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

  {{/* Breadcrumb */}}
  <nav class="flex items-center gap-2 text-xs text-slate-500 mb-6">
    <a href="/" class="hover:text-indigo-600 transition-colors">Home</a>
    <span class="text-slate-300">/</span>
    <span class="text-slate-800 font-medium">{{ .Title }}</span>
  </nav>

  {{/* Header */}}
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-6">
    <div class="h-1.5 bg-indigo-600"></div>
    <div class="p-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 mb-2">
        {{ .Title }}
      </h1>
      {{ with .Description }}
        <p class="text-sm text-slate-500 leading-relaxed">{{ . }}</p>
      {{ end }}
    </div>
  </div>

  {{/* Content */}}
  <article class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 sm:p-10">
    <div class="prose prose-slate max-w-none
                prose-headings:font-extrabold prose-headings:tracking-tight prose-headings:text-slate-900
                prose-h2:text-xl prose-h2:mt-8 prose-h2:mb-3
                prose-h3:text-base prose-h3:mt-6 prose-h3:mb-2
                prose-p:text-slate-600 prose-p:leading-relaxed prose-p:my-3
                prose-a:text-indigo-600 prose-a:font-semibold prose-a:no-underline hover:prose-a:underline
                prose-strong:text-slate-900
                prose-ul:my-3 prose-li:text-slate-600 prose-li:my-1
                prose-hr:my-8 prose-hr:border-slate-200
                prose-em:text-slate-500">
      {{ .Content }}
    </div>
  </article>

  {{/* Footer CTA */}}
  <div class="mt-6 text-center text-xs text-slate-500">
    <p>Have questions? <a href="/contact/" class="text-indigo-600 font-semibold hover:text-indigo-700">Contact us</a></p>
  </div>

</div>

{{ end }}
