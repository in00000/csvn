name: Build & Deploy Hugo Site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * *"     # runs daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.139.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Kolkata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # ══════════════════════════════════════════════════════════
      #  DUMMY CLIENTS (OPTIONAL)
      #  Runs only if scripts/dummy-clients.py exists.
      #  Delete that file to permanently remove all sample data.
      # ══════════════════════════════════════════════════════════
      - name: Generate dummy clients (optional)
        run: |
          if [ -f scripts/dummy-clients.py ]; then
            echo "Found scripts/dummy-clients.py — generating dummy clients"
            python3 scripts/dummy-clients.py
          else
            echo "scripts/dummy-clients.py not found — skipping dummy generation"
          fi

      # ══════════════════════════════════════════════════════════
      #  LISTING PAGE GENERATION
      #  Converts data/clients/*.json into content/listings/*.md
      #  Sample listings get params.noindex = true so templates can
      #  add <meta name="robots" content="noindex"> and exclude them
      #  from the sitemap.
      # ══════════════════════════════════════════════════════════
      - name: Generate listing pages from JSON
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          root     = Path.cwd()
          data_dir = root / "data" / "clients"
          out_dir  = root / "content" / "listings"
          out_dir.mkdir(parents=True, exist_ok=True)

          # Clean any stale generated files
          for old in out_dir.glob("*.md"):
              old.unlink()

          def esc(s):
              if s is None: return '""'
              s = str(s)
              s = s.replace('\\', '\\\\').replace('"', '\\"')
              s = s.replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
              return '"' + s + '"'

          def toml_val(v):
              if v is None: return '""'
              if isinstance(v, bool): return "true" if v else "false"
              if isinstance(v, (int, float)): return str(v)
              if isinstance(v, str): return esc(v)
              if isinstance(v, list):
                  if not v: return "[]"
                  if isinstance(v[0], dict):
                      items = []
                      for d in v:
                          pairs = [f'{k} = {toml_val(val)}' for k, val in d.items()]
                          items.append("{ " + ", ".join(pairs) + " }")
                      return "[" + ", ".join(items) + "]"
                  return "[" + ", ".join(toml_val(x) for x in v) + "]"
              if isinstance(v, dict):
                  pairs = [f'{k} = {toml_val(val)}' for k, val in v.items()]
                  return "{ " + ", ".join(pairs) + " }"
              return esc(str(v))

          total = 0
          sample_count = 0
          for json_file in sorted(data_dir.glob("*.json")):
              with open(json_file, "r", encoding="utf-8") as f:
                  clients = json.load(f)
              for client in clients:
                  slug = client["id"]

                  # A listing is a SAMPLE if either _dummy or _sample is true.
                  # Samples are excluded from Google (noindex + sitemap filter)
                  # so they never dilute the domain's search reputation.
                  is_sample = bool(client.get("_dummy") or client.get("_sample"))

                  lines = ["+++"]
                  lines.append(f'title = {esc(client.get("name", ""))}')
                  lines.append('draft = false')
                  lines.append(f'categories = {toml_val([client.get("category", "")])}')
                  if is_sample:
                      lines.append('params.noindex = true')
                      lines.append('params.isSample = true')
                  for k, v in client.items():
                      if k in ("_dummy", "_sample"):
                          continue
                      # Avoid duplicating the two keys we already wrote above
                      if is_sample and k in ("noindex", "isSample"):
                          continue
                      lines.append(f'params.{k} = {toml_val(v)}')
                  lines.append('+++')
                  lines.append('')
                  out_file = out_dir / f"{slug}.md"
                  out_file.write_text("\n".join(lines), encoding="utf-8")
                  total += 1
                  if is_sample:
                      sample_count += 1
          print(f"Generated {total} listing pages ({sample_count} marked as samples / noindex)")

          # ── Generate one page per category ─────────────────────
          cat_out = root / "content" / "categories"
          cat_out.mkdir(parents=True, exist_ok=True)
          for old in cat_out.glob("*.md"):
              old.unlink()

          # All-categories index
          (cat_out / "_index.md").write_text(
              '+++\ntitle = "All Categories"\nlayout = "terms"\n+++\n',
              encoding="utf-8"
          )

          with open(root / "data" / "categories.json", "r", encoding="utf-8") as f:
              cats_data = json.load(f)

          cat_count = 0
          for cat in cats_data["categories"]:
              fm = [
                  "+++",
                  f'title = {esc(cat.get("name", ""))}',
                  f'slug = {esc(cat.get("slug", ""))}',
                  f'description = {esc(cat.get("description", ""))}',
                  f'group = {esc(cat.get("group", ""))}',
                  'layout = "category"',
                  "+++",
                  "",
              ]
              (cat_out / f"{cat['slug']}.md").write_text("\n".join(fm), encoding="utf-8")
              cat_count += 1

          print(f"Generated {cat_count} category pages")
          PYEOF

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
          echo ""
          echo "=== Content folder ==="
          ls -la content/listings/ | head -20
          echo ""
          echo "=== Built listings folder ==="
          ls -la public/listings/ 2>/dev/null | head -20 || echo "public/listings/ MISSING"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
